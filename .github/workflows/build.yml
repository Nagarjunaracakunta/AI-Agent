name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check syntax
        run: python -m compileall app.py agent.py schemas.py tools crew pages

      - name: Run tests
        run: python -m pytest -q


  publish:
    name: Publish image and deploy to Hugging Face
    needs: build
    # Only deploy from these branches on pushes (never on pull requests)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/multiagent')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nagarjunaracakunta/ai-agent
      HF_SPACE: Nagarjuna2026/AI-Agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://Nagarjuna2026:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space
          cd space
          printf 'FROM %s:%s\n' "$IMAGE" "$GITHUB_SHA" > Dockerfile
          cat > README.md <<'README'
          ---
          title: AI Agent
          emoji: 💬
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          app_port: 7860
          ---
          README
          git config user.email "ci@users.noreply.github.com"
          git config user.name "github-actions"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push
